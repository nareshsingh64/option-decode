# Stop needrestart from silently restarting MySQL right after a libc/security
# package upgrade (e.g. glibc). needrestart still detects and flags mysql as
# needing a restart, it just won't act on it immediately. A separate cron job
# (ops/cron/option-decode-mysql-safe-restart) performs the actual restart, but
# only after market close (15:30 IST).
#
# override_rc value 0 = "do not auto-restart this service" (same convention
# already used upstream for NetworkManager/sshd-adjacent services that must
# not be bounced without warning).
$nrconf{override_rc}{qr(^mysql)} = 0;
