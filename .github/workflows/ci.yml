name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # No live database is needed for typecheck/lint/test - packages/db's
  # schema.prisma references DATABASE_URL, and `prisma generate` needs the
  # variable present to resolve the schema even though it never connects.
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
